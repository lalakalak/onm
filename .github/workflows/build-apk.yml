name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Detect project folder
        run: |
          if [ -f "$GITHUB_WORKSPACE/OM-Shift-Manager-Android/web/package.json" ]; then
            echo "PROJECT_DIR=OM-Shift-Manager-Android" >> "$GITHUB_ENV"
          elif [ -f "$GITHUB_WORKSPACE/web/package.json" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo 'Could not find web/package.json. Upload the project folder contents or the complete OM-Shift-Manager-Android folder.'
            find . -maxdepth 3 -name package.json -print
            exit 1
          fi

      - name: Install web dependencies and build assets
        run: |
          cd "$PROJECT_DIR/web"
          npm install
          npm run build

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: om-shift-manager-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
